app = 'mcvoice'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
